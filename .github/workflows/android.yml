name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ShitMate Phone APK
      run: ./gradlew :app:assembleProdDebug -Pshitmate.bundleWear=false --stacktrace

    - name: Prepare APK
      run: |
        mkdir -p release_apk
        for f in app/build/outputs/apk/prod/debug/*.apk app/build/outputs/apk/dev/debug/*.apk; do
          if [ -f "$f" ]; then
            if [[ "$f" == *"arm64"* ]]; then
              cp "$f" release_apk/ShitMate-arm64.apk
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" release_apk/ShitMate-Universal.apk
              cp "$f" release_apk/ShitMate.apk
            elif [[ "$f" == *"v7a"* ]]; then
              cp "$f" release_apk/ShitMate-armeabi-v7a.apk
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" release_apk/ShitMate-x86_64.apk
            fi
          fi
        done
        if [ ! -f release_apk/ShitMate.apk ]; then
          first_apk=$(ls app/build/outputs/apk/prod/debug/*.apk app/build/outputs/apk/dev/debug/*.apk 2>/dev/null | head -n 1)
          cp "$first_apk" release_apk/ShitMate.apk
        fi
        ls -la release_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShitMate-APKs
        path: release_apk/

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: "ShitMate v1.0.1"
        body: |
          ### ShitMate v1.0.1 Release
          
          Direct Android APK downloads attached below:
          - ⬇️ **ShitMate.apk** (Universal - works on all devices)
          - ⬇️ **ShitMate-arm64.apk** (Optimized for modern 64-bit phones)
          
          #### Features:
          - 🎵 Aesthetic YouTube Music & Hi-Res lossless playback
          - 🎤 Karaoke / Vocal Suppressor DSP Mode (in Equalizer settings)
          - 📊 Reactive Neon Audio Visualizer component
          - 🖤 True AMOLED Pitch-Black Theme
          - 🌙 Smart Sleep Timer with smooth volume fade-out
          - ⚡ Clean "ShitMate" App Label (no Dev suffix)
        files: release_apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
