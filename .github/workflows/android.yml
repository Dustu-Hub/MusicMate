name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup permanent signing keystore
      run: |
        echo "" | base64 -d > shitmate.jks
        mkdir -p ~/.android
        cp shitmate.jks ~/.android/debug.keystore
        printf 'storeFile=shitmate.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > keystore.properties

    - name: Build ShitMate Phone APK
      run: ./gradlew :app:assembleProdDebug :app:assembleDevDebug -Pshitmate.bundleWear=false --stacktrace

    - name: Prepare APK
      run: |
        VERSION=$(sed -nE 's/.*extra\["shitmateVersionName"\] = "([^"]+)".*/\1/p' build.gradle.kts)
        if [ -z "$VERSION" ]; then
          VERSION="2.0.4"
        fi
        echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV
        echo "RELEASE_NAME=ShitMate v$VERSION" >> $GITHUB_ENV
        echo "Detected version: v$VERSION"

        mkdir -p release_apk
        # Copy production APKs
        for f in app/build/outputs/apk/prod/debug/*.apk; do
          if [ -f "$f" ]; then
            if [[ "$f" == *"arm64"* ]]; then
              cp "$f" release_apk/ShitMate-arm64.apk
              cp "$f" "release_apk/ShitMate-v${VERSION}.apk"
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" release_apk/ShitMate-Universal.apk
              cp "$f" release_apk/ShitMate.apk
            elif [[ "$f" == *"v7a"* ]]; then
              cp "$f" release_apk/ShitMate-armeabi-v7a.apk
            elif [[ "$f" == *"x86_64"* ]]; then
              cp "$f" release_apk/ShitMate-x86_64.apk
            fi
          fi
        done
        # Copy dev APKs for users on com.dev.shitmate
        for f in app/build/outputs/apk/dev/debug/*.apk; do
          if [ -f "$f" ]; then
            if [[ "$f" == *"arm64"* ]]; then
              cp "$f" release_apk/ShitMate-dev-arm64.apk
            elif [[ "$f" == *"universal"* ]]; then
              cp "$f" release_apk/ShitMate-dev-Universal.apk
            fi
          fi
        done
        if [ ! -f release_apk/ShitMate.apk ]; then
          first_apk=$(ls app/build/outputs/apk/prod/debug/*.apk app/build/outputs/apk/dev/debug/*.apk 2>/dev/null | head -n 1)
          cp "$first_apk" release_apk/ShitMate.apk
        fi
        ls -la release_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShitMate-APKs
        path: release_apk/

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.APP_VERSION }}
        name: ${{ env.RELEASE_NAME }}
        body: |
          ### ${{ env.RELEASE_NAME }} Release
          
          Direct Android APK downloads attached below:
          - ⬇️ **ShitMate.apk** (Universal - works on all devices)
          - ⬇️ **ShitMate-arm64.apk** (Optimized for modern 64-bit phones)
          
          #### What's New in ${{ env.RELEASE_NAME }}:
          - 🎵 **Listen Together**: Free real-time party sync backend powered by Render Go server
          - 🔗 Clean party invite sharing with 6-character room codes (removed broken web link)
          - 🔄 **Reliable In-App Updater**: Added rate-limit-free GitHub fallback, Android 11+ `<queries>` installer visibility, automatic resume after Unknown Sources permission, APK integrity checks, and clear Up-to-date / Error dialogs
          - ⚡ Clean **ShitMate** branding across the entire app
          - 🔑 Unified permanent cryptographic signing
          - 🎤 Karaoke / Vocal Suppressor DSP Mode (Equalizer settings)
          - 📊 Neon Audio Waveform Visualizer
          - 🖤 True AMOLED Pitch-Black Theme
          - 🌙 Smart Sleep Timer with smooth volume fade-out
        files: release_apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
